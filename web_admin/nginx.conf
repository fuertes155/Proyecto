server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas SPA — Flutter Web maneja el routing del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets estáticos de Flutter (hashes en los nombres de archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desactivar acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
}
