# ==============================================================================
# docker-compose.prod.yml — Stack completo de producción
# ==============================================================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# ⚠️  Los frontends (web-admin y web-comercial) están comentados:
#   - Si los despliegas en hosting estático (Vercel, Netlify, S3), no los necesitas.
#   - Si los despliegas en tu propio VPS/servidor, descomenta los bloques.
# ==============================================================================

services:

  # ─── Base de datos ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: met-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - met-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: met-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - met-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Java ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: met-platform/Dockerfile
    container_name: met-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY}
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET}
      WOMPI_WEBHOOK_SECRET: ${WOMPI_WEBHOOK_SECRET}
      WOMPI_API_URL: ${WOMPI_API_URL}
      # 🔐 Contraseña del Super Admin inicial — genera un BCrypt hash primero
      SUPERADMIN_PASSWORD_HASH: ${SUPERADMIN_PASSWORD_HASH}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-}
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
    networks:
      - met-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─── Servicio de Notificaciones (Go) ──────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: met-notifications-prod
    restart: always
    environment:
      PORT: 8090
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
    networks:
      - met-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Proxy Reverso (Nginx + SSL) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: met-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      web-comercial:
        condition: service_healthy
    networks:
      - met-internal

  # ─── Web Admin (Flutter Web) ──────────────────────────────────────
  web-admin:
    build:
      context: ./web_admin
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
        HMAC_SECRET: ${HMAC_SECRET}
    container_name: met-web-admin-prod
    restart: always
    networks:
      - met-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Web Comercial (Next.js) ───────────────────────────────────────
  web-comercial:
    build:
      context: ./web_comercial
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL}
    container_name: met-web-comercial-prod
    restart: always
    networks:
      - met-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  met-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
