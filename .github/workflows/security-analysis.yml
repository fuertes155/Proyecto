name: Security Analysis (SAST & SCA)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Ejecutar escaneo diario a la medianoche para atrapar CVEs recientes de NVD
    - cron: '0 0 * * *'

jobs:
  sast-sca-analysis:
    name: SonarQube SAST and OWASP SCA
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: met
          POSTGRES_USER: met
          POSTGRES_PASSWORD: met_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U met -d met"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        ports:
          - 8200:8200
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que SonarQube analice el historial de git correctamente
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Flutter - Get Dependencies
        working-directory: ./mobile/met_app
        run: flutter pub get
        
      - name: Flutter - SCA (Outdated Packages Check)
        working-directory: ./mobile/met_app
        run: dart pub outdated --no-dev-dependencies --json > flutter_outdated.json
        # En una integración avanzada, se parsea este JSON para romper el build si hay paquetes con severidad alta.

      - name: Backend - OWASP Dependency Check (SCA)
        working-directory: ./backend/met-platform
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: met
          DB_USER: met
          DB_PASSWORD: met_secret
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          AES_KEY: ${{ secrets.CI_AES_KEY }}
          VAULT_URI: http://localhost:8200
          VAULT_TOKEN: root
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000
          WOMPI_PUBLIC_KEY: pub_stagtest_dummy
          WOMPI_PRIVATE_KEY: prv_stagtest_dummy
          WOMPI_INTEGRITY_SECRET: dummy_integrity
          WOMPI_WEBHOOK_SECRET: dummy_webhook
          COMPLIANCE_ENTITY_CODE: COOP001
          GEMINI_API_KEY: ""
          SUPERADMIN_PASSWORD_HASH: "$2a$10$dummyHashForCIOnlyNotARealPasswordXXXXXXXXXXXXXXXXXXXX"
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true # Continúa incluso si la base de datos NVD falla al descargar por falta de API Key
        
      - name: Backend & Frontend - SonarQube (SAST)
        # Se requiere configurar SONAR_TOKEN en los Secrets de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: met
          DB_USER: met
          DB_PASSWORD: met_secret
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          AES_KEY: ${{ secrets.CI_AES_KEY }}
          VAULT_URI: http://localhost:8200
          VAULT_TOKEN: root
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000
          WOMPI_PUBLIC_KEY: pub_stagtest_dummy
          WOMPI_PRIVATE_KEY: prv_stagtest_dummy
          WOMPI_INTEGRITY_SECRET: dummy_integrity
          WOMPI_WEBHOOK_SECRET: dummy_webhook
          COMPLIANCE_ENTITY_CODE: COOP001
          GEMINI_API_KEY: ""
          SUPERADMIN_PASSWORD_HASH: "$2a$10$dummyHashForCIOnlyNotARealPasswordXXXXXXXXXXXXXXXXXXXX"
        working-directory: ./backend/met-platform
        # mvn sonar:sonar usa las propiedades configuradas en el archivo raíz sonar-project.properties si se le indica
        run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=met-platform -Dsonar.projectName="Met Platform"
        continue-on-error: true # Continúa en rojo si Sonar_TOKEN no está configurado, para no bloquear tu CI mientras pruebas.
