name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintech
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test backend
        working-directory: backend
        run: mvn -pl fintech-platform -am verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fintech
          DB_USER: fintech
          DB_PASSWORD: fintech_secret

  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build notification service
        working-directory: services/notification-service
        run: go build -o bin/server ./cmd/server

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze Flutter app
        working-directory: mobile/fintech_app
        run: |
          flutter pub get
          flutter analyze
