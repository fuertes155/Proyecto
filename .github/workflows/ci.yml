name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: met
          POSTGRES_USER: met
          POSTGRES_PASSWORD: met_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U met -d met"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        ports:
          - 8200:8200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test backend
        working-directory: backend
        # mvn verify ejecuta: compile → test → JaCoCo check → OWASP → SpotBugs
        # OWASP dependency-check se omite aquí: sin NVD_API_KEY, la NVD devuelve 403/404
        # y tumba el build en cada push. El escaneo de CVEs ya corre a diario en
        # security-analysis.yml con continue-on-error, que es donde debe vivir.
        run: mvn -pl met-platform -am verify -Ddependency-check.skip=true
        env:
          # Base de datos
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: met
          DB_USER: met
          DB_PASSWORD: met_secret
          # Seguridad — valores de CI (mínimo 64 chars para JWT, 32 para AES)
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          AES_KEY: ${{ secrets.CI_AES_KEY }}
          # HashiCorp Vault (modo dev para CI)
          VAULT_URI: http://localhost:8200
          VAULT_TOKEN: root
          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          # CORS (valor dummy para CI)
          CORS_ORIGINS: http://localhost:3000
          # Wompi (modo sandbox para CI — no hace transacciones reales)
          WOMPI_PUBLIC_KEY: pub_stagtest_dummy
          WOMPI_PRIVATE_KEY: prv_stagtest_dummy
          WOMPI_INTEGRITY_SECRET: ${{ secrets.CI_WOMPI_INTEGRITY_SECRET }}
          WOMPI_WEBHOOK_SECRET: ${{ secrets.CI_WOMPI_WEBHOOK_SECRET }}
          # Compliance (modo mock para CI)
          COMPLIANCE_ENTITY_CODE: COOP001
          # Gemini AI (no requerido en tests unitarios)
          GEMINI_API_KEY: ""
          # Flyway placeholder — hash BCrypt dummy para CI (no es un admin real)
          # Se reemplaza con el valor real en producción via SUPERADMIN_PASSWORD_HASH
          SUPERADMIN_PASSWORD_HASH: "$2a$10$dummyHashForCIOnlyNotARealPasswordXXXXXXXXXXXXXXXXXXXX"

  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build and test notification service
        working-directory: services/notification-service
        run: |
          go build -o bin/server ./cmd/server
          go vet ./...
          go test ./...

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: mobile/met_app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile/met_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Run Flutter tests
        working-directory: mobile/met_app
        run: flutter test

  web-comercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: web_comercial
        run: npm ci
      - name: Lint, test and build
        working-directory: web_comercial
        run: |
          npm run lint
          npm run test
          npm run build

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Flutter Web
        run: flutter config --enable-web
      - name: Get dependencies
        working-directory: web_admin
        run: flutter pub get
      - name: Analyze web_admin
        working-directory: web_admin
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Run web_admin tests
        working-directory: web_admin
        run: flutter test
      - name: Build web_admin (release)
        working-directory: web_admin
        run: flutter build web --release
