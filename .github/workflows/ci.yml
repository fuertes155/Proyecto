name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: met
          POSTGRES_USER: met
          POSTGRES_PASSWORD: met_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U met -d met"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test backend
        working-directory: backend
        run: mvn -pl met-platform -am verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: met
          DB_USER: met
          DB_PASSWORD: met_secret
          SPRING_CLOUD_VAULT_ENABLED: false
          SPRING_CONFIG_IMPORT: ""

  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build notification service
        working-directory: services/notification-service
        run: go build -o bin/server ./cmd/server

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze Flutter app
        working-directory: mobile/met_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
