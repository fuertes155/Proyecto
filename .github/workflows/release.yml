name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          
      - name: Verify Backend
        working-directory: backend
        run: mvn -pl met-platform -am verify -DskipTests
        
      - name: Build and Push Docker Image
        # TODO: Configure Docker registry credentials
        run: |
          echo "Building docker image met/backend:${{ github.ref_name }}"
          # docker build -t met/backend:${{ github.ref_name }} ./backend/met-platform
          # docker push met/backend:${{ github.ref_name }}
