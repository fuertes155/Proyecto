apiVersion: apps/v1
kind: Deployment
metadata:
  name: met-backend
  namespace: met
spec:
  replicas: 3
  selector:
    matchLabels:
      app: met-backend
  template:
    metadata:
      labels:
        app: met-backend
    spec:
      containers:
        - name: backend
          image: met/backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: met-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: met-backend
  namespace: met
spec:
  selector:
    app: met-backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
