apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: met
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: met
spec:
  podSelector:
    matchLabels:
      app: met-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # TODO: restringir a los pods/namespace reales del Ingress Controller una vez
    # instalado (p.ej. ingress-nginx en su propio namespace). Se deja abierto a nivel
    # de cluster mientras tanto — el enrutamiento externo real lo define ingress.yaml.
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: met-notifications
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - namespaceSelector: {} # Allow DNS
      ports:
        - protocol: UDP
          port: 53
