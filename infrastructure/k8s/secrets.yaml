apiVersion: v1
kind: Secret
metadata:
  name: met-secrets
  namespace: met
  labels:
    app: met-platform
    managed-by: "manual"
type: Opaque
# INSTRUCCIONES:
# NO committear este archivo con valores reales.
# En producción, los valores se inyectan desde el pipeline de CI/CD
# usando GitHub Secrets → kubectl create secret / helm upgrade --set.
#
# Para generar una versión sellada (SealedSecret con kubeseal):
#   kubeseal --format yaml < secrets.yaml > sealed-secrets.yaml
#
# Para crear manualmente en el cluster (solo en desarrollo):
#   kubectl create secret generic met-secrets \
#     --from-literal=JWT_SECRET=<valor> \
#     --from-literal=AES_KEY=<valor> \
#     ...  -n met
stringData:
  # ── Autenticación JWT ──────────────────────────────────────────────────────
  JWT_SECRET: ""                     # Min 64 chars, base64-encoded
  JWT_EXPIRATION_MS: "1800000"       # 30 minutos (default seguro para fintech)
  JWT_REFRESH_EXPIRATION_MS: "604800000"  # 7 días

  # ── Cifrado de Datos Personales (AES-256) ─────────────────────────────────
  AES_KEY: ""                        # Exactamente 32 bytes en UTF-8

  # ── Base de Datos PostgreSQL ───────────────────────────────────────────────
  DB_PASSWORD: ""
  DB_USER: ""
  DB_NAME: ""

  # ── Redis ──────────────────────────────────────────────────────────────────
  REDIS_PASSWORD: ""

  # ── HashiCorp Vault ────────────────────────────────────────────────────────
  VAULT_TOKEN: ""                    # En prod usar AppRole, no root token

  # ── Wompi (Pasarela de Pagos) ─────────────────────────────────────────────
  WOMPI_PUBLIC_KEY: ""
  WOMPI_PRIVATE_KEY: ""
  WOMPI_INTEGRITY_SECRET: ""
  WOMPI_WEBHOOK_SECRET: ""

  # ── Correo SMTP ───────────────────────────────────────────────────────────
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

  # ── Notification Microservice ─────────────────────────────────────────────
  NOTIFICATION_API_KEY: ""

  # ── DataCrédito (Buró de Crédito) ─────────────────────────────────────────
  DATACREDITO_CLIENT_ID: ""
  DATACREDITO_CLIENT_SECRET: ""

  # ── Gemini AI (Feature futura) ────────────────────────────────────────────
  GEMINI_API_KEY: ""

  # ── Cloudflare Turnstile (CAPTCHA) ────────────────────────────────────────
  TURNSTILE_SECRET_KEY: ""

  # ── CORS ──────────────────────────────────────────────────────────────────
  CORS_ORIGINS: ""                   # Ej: https://app.cooperativa.met.com
