apiVersion: apps/v1
kind: Deployment
metadata:
  name: met-notifications
  namespace: met
spec:
  replicas: 2
  selector:
    matchLabels:
      app: met-notifications
  template:
    metadata:
      labels:
        app: met-notifications
    spec:
      containers:
        - name: notifications
          image: met/notifications:latest
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: met-notifications
  namespace: met
spec:
  selector:
    app: met-notifications
  ports:
    - port: 80
      targetPort: 8090
