apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-notifications
  namespace: fintech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fintech-notifications
  template:
    metadata:
      labels:
        app: fintech-notifications
    spec:
      containers:
        - name: notifications
          image: fintech/notifications:latest
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fintech-notifications
  namespace: fintech
spec:
  selector:
    app: fintech-notifications
  ports:
    - port: 80
      targetPort: 8090
