events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Bloquear versiones antiguas de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # Redireccionar HTTP a HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # Certificados locales generados por OpenSSL
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Configuración de cabeceras de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WAF Básico: Prevenir Clickjacking, XSS
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # HSTS — Obliga HTTPS durante 1 año (crítico para fintech)
        # preload: permite inclusión en la lista de preload de los navegadores
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # CSP — Restringe qué recursos puede cargar el navegador.
        # Ajustar según las fuentes reales de scripts/styles del web_comercial.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # Referrer-Policy — No filtrar información en el header Referer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions-Policy — Deshabilitar APIs del navegador no necesarias
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # Route to Java Backend
        location /api/ {
            proxy_pass http://backend:8080/api/;
        }

        # Route to Notifications Microservice
        location /notifications/ {
            proxy_pass http://notification-service:8090/;
        }
    }
}
