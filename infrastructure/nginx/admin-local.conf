# Panel administrativo web para desarrollo local (servicio admin-web de docker-compose.yml).
# Sirve el build de Flutter Web de web_admin (compilado con --base-href /admin/) y reenvía
# /api al backend, igual que infrastructure/nginx/nginx.conf en producción.
server {
    listen 80;
    server_name _;

    location = / {
        return 302 /admin/;
    }

    # index.html y el service worker sin caché: así un build nuevo se ve con solo recargar.
    location ~ ^/admin/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)?$ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
