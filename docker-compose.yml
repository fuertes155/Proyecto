services:
  vault:
    image: hashicorp/vault:1.15
    container_name: met-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    networks:
      - met-secure-net
    cap_add:
      - IPC_LOCK

  postgres:
    image: postgres:16-alpine
    container_name: met-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - met-secure-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: met-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # ports:
    #   - "6379:6379" # Deshabilitado por seguridad en producción
    volumes:
      - redis_data:/data
    networks:
      - met-secure-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: met-platform/Dockerfile
    container_name: met-backend
    restart: unless-stopped
    # Puerto publicado solo para desarrollo local: las apps Flutter (web/emulador)
    # apuntan a http://localhost:8080/api. En producción el acceso es vía nginx.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
      VAULT_URI: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COMPLIANCE_ENTITY_CODE: ${COMPLIANCE_ENTITY_CODE:-COOP001}
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      HMAC_SECRET: ${HMAC_SECRET}
      SUPERADMIN_PASSWORD_HASH: ${SUPERADMIN_PASSWORD_HASH}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET}
      WOMPI_WEBHOOK_SECRET: ${WOMPI_WEBHOOK_SECRET}
      WOMPI_API_URL: ${WOMPI_API_URL}
      WOMPI_CHECKOUT_URL: ${WOMPI_CHECKOUT_URL}
      MET_PAYMENTS_MOCK_GATEWAY_BASE_URL: ${MET_PAYMENTS_MOCK_GATEWAY_BASE_URL:-}
      WOMPI_PAYOUTS_API_URL: ${WOMPI_PAYOUTS_API_URL}
      WOMPI_PAYOUTS_API_KEY: ${WOMPI_PAYOUTS_API_KEY}
      WOMPI_PAYOUTS_PRINCIPAL_USER_ID: ${WOMPI_PAYOUTS_PRINCIPAL_USER_ID}
      WOMPI_PAYOUTS_SOURCE_ACCOUNT_ID: ${WOMPI_PAYOUTS_SOURCE_ACCOUNT_ID}
      WOMPI_PAYOUTS_WEBHOOK_SECRET: ${WOMPI_PAYOUTS_WEBHOOK_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY}
    networks:
      - met-secure-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: met-notifications
    restart: unless-stopped
    environment:
      PORT: 8090
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY}
      # Dev local: arranca sin credenciales de Firebase (los push devuelven error).
      # En producción NO definir esta variable para que el fallo sea fatal.
      FCM_OPTIONAL: ${FCM_OPTIONAL:-true}
    networks:
      - met-secure-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: met-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - notification-service
    networks:
      - met-secure-net

networks:
  met-secure-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
