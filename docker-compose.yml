services:
  postgres:
    image: postgres:16-alpine
    container_name: met-postgres
    environment:
      POSTGRES_DB: met
      POSTGRES_USER: met
      POSTGRES_PASSWORD: met_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U met -d met"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: met-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: met-platform/Dockerfile
    container_name: met-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: met
      DB_USER: met
      DB_PASSWORD: met_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-key-with-minimum-256-bits-length-required
      AES_KEY: dev-aes-key-32-characters-long!!
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: met-notifications
    ports:
      - "8090:8090"

volumes:
  postgres_data:
