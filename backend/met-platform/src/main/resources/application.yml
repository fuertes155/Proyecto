spring:
  application:
    name: met-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:met}
    username: ${DB_USER:met}
    password: ${DB_PASSWORD:met_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

met:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key-minimum-length-required}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    encryption:
      aes-key: ${AES_KEY:change-me-32-chars-key-for-aes256!!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  compliance:
    entity-code: ${COMPLIANCE_ENTITY_CODE:COOP001}
    storage-path: ${COMPLIANCE_STORAGE_PATH:./data/regulatory-reports}

logging:
  level:
    com.cooperativa.met: INFO
    org.springframework.security: WARN
