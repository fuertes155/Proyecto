spring:
  application:
    name: met-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:met}
    username: ${DB_USER:met}
    password: ${DB_PASSWORD:met_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

met:
  security:
    jwt:
      # Obligatorio: no usar defaults en producción
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    encryption:
      # Obligatorio: no usar defaults en producción
      aes-key: ${AES_KEY}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  compliance:
    entity-code: ${COMPLIANCE_ENTITY_CODE:COOP001}
    storage-path: ${COMPLIANCE_STORAGE_PATH:./data/regulatory-reports}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Máximo de intentos de autenticación permitidos por IP en la ventana de tiempo
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    # Ventana de tiempo en segundos (60 = 10 intentos por minuto por IP)
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    com.cooperativa.met: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
