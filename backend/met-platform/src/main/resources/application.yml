spring:
  application:
    name: met-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:met}
    username: ${DB_USER:met}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Hash BCrypt de la contraseña del super administrador inicial.
      # Obligatorio: Genera el hash y ponlo en la variable de entorno en tu servidor.
      # Comando para generar: htpasswd -bnBC 12 "" <PASSWORD> | tr -d ':\n' | sed 's/$2y/$2a/'
      superadmin_password_hash: ${SUPERADMIN_PASSWORD_HASH}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # --- Configuracion de Vault (Secret Manager) ---
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        default-context: met-platform

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api
  # Límite de tamaño de petición HTTP — protección contra ataques DoS por payloads enormes
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 5MB
spring.mvc.async.request-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      # El endpoint de métricas solo es accesible internamente (scraping de Prometheus)
      access: read_only
  # Trazabilidad distribuida → Zipkin
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    # En producción reducir a 0.1 (10% de muestreo) para eficiencia
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}


met:
  security:
    jwt:
      # Obligatorio: no usar defaults en producción
      secret: ${JWT_SECRET}
      # Access token: 30 min (estándar para apps financieras — el refresh token renueva la sesión)
      expiration-ms: ${JWT_EXPIRATION_MS:1800000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    encryption:
      # Secreto compartido con el cliente (mobile) para firmar HMAC de requests que modifican estado.
      # Obligatorio: no usar defaults en producción. Debe coincidir con AppConfig.hmacSecret del cliente.
      hmac-secret: ${HMAC_SECRET}
      # Obligatorio: no usar defaults en producción
      aes-key: ${AES_KEY}
      # Par RSA para E2EE del PIN (ver AesEncryptionAdapter#decryptRsa). Si se dejan vacíos,
      # el adapter genera un par efímero en cada arranque — cualquier cliente que ya haya
      # obtenido la llave pública anterior fallará al descifrar hasta recargar la app.
      rsa-private-key: ${RSA_PRIVATE_KEY:}
      rsa-public-key: ${RSA_PUBLIC_KEY:}
  mail:
    # Proveedor de envío: 'smtp' (JavaMailSender, para local) o 'brevo' (API HTTP,
    # para Render que bloquea el SMTP saliente). Ver SmtpEmailSender / BrevoEmailSender.
    provider: ${MAIL_PROVIDER:smtp}
    brevo:
      # API key de Brevo (Settings → SMTP & API → API Keys). Obligatoria si provider=brevo.
      api-key: ${BREVO_API_KEY:}
    # Nombre visible del remitente.
    from-name: ${MAIL_FROM_NAME:MET}
    # Remitente real de los correos transaccionales (OTP, verificación, alertas).
    # Con SMTP de Gmail el remitente DEBE coincidir con la cuenta autenticada (MAIL_USERNAME).
    # Con Brevo sin dominio propio: verifica esta dirección en Brevo (Senders) — llega un
    # correo de confirmación. Al tener dominio propio, verifica el dominio (DNS) y usa
    # no-reply@tudominio.com vía MAIL_FROM_ADDRESS.
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@met.com}}
    # Si el envío falla, por defecto se debe lanzar un error real (no se oculta el fallo al usuario).
    # Solo development/local activa el fallback que imprime el OTP en logs (ver application-dev.yml).
    log-otp-on-failure: ${MAIL_LOG_OTP_ON_FAILURE:false}
  ai:
    gemini:
      # API Key de Google Gemini para el módulo de chat y soporte.
      # Para habilitarlo, configura la variable de entorno GEMINI_API_KEY en tu sistema o en el archivo .env
      api-key: ${GEMINI_API_KEY:tu_api_key}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  compliance:
    entity-code: ${COMPLIANCE_ENTITY_CODE:COOP001}
    storage-path: ${COMPLIANCE_STORAGE_PATH:./data/regulatory-reports}
    sarlaft:
      # Fuentes públicas oficiales, sin autenticación ni contrato (a diferencia de
      # DataCrédito): SDN list del Tesoro de EE.UU. y lista consolidada de la ONU.
      ofac-list-url: ${SARLAFT_OFAC_LIST_URL:https://www.treasury.gov/ofac/downloads/sdn.csv}
      un-list-url: ${SARLAFT_UN_LIST_URL:https://scsanctions.un.org/resources/xml/en/consolidated.xml}
      restrictive-list-match-threshold: ${SARLAFT_LIST_MATCH_THRESHOLD:0.82}
      unusual-amount-threshold: ${SARLAFT_UNUSUAL_AMOUNT_THRESHOLD:10000000}
      unusual-amount-multiplier: ${SARLAFT_UNUSUAL_AMOUNT_MULTIPLIER:5}
      max-transactions-per-day: ${SARLAFT_MAX_TX_PER_DAY:10}
      structuring-lower-ratio: ${SARLAFT_STRUCTURING_LOWER_RATIO:0.8}
      structuring-min-occurrences: ${SARLAFT_STRUCTURING_MIN_OCCURRENCES:3}
      rapid-in-out-window-minutes: ${SARLAFT_RAPID_IN_OUT_WINDOW_MINUTES:60}
  credit-bureau:
    provider: ${CREDIT_BUREAU_PROVIDER:mock}
    datacredito:
      base-url: ${DATACREDITO_API_URL:https://api.experian.com.co}
      client-id: ${DATACREDITO_CLIENT_ID:}
      client-secret: ${DATACREDITO_CLIENT_SECRET:}
      # URL del endpoint OAuth2 (grant_type=client_credentials). Sin default: se define
      # al firmar el contrato con DataCrédito. Ver DatacreditoOAuthTokenProvider.
      token-url: ${DATACREDITO_TOKEN_URL:}
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Máximo de intentos de autenticación permitidos por IP en la ventana de tiempo
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    # Ventana de tiempo en segundos (60 = 10 intentos por minuto por IP)
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  wompi:
    # Credenciales del comercio - obtenerlas en dashboard.wompi.co
    public-key: ${WOMPI_PUBLIC_KEY}
    private-key: ${WOMPI_PRIVATE_KEY}
    # Secret de integridad (para calcular el hash SHA-256 del link de pago)
    integrity-secret: ${WOMPI_INTEGRITY_SECRET}
    # Secret para validar firmas de webhooks entrantes de Wompi
    webhook-secret: ${WOMPI_WEBHOOK_SECRET}
    api-url: ${WOMPI_API_URL:https://sandbox.wompi.co/v1}
    # URL base del checkout Wompi (donde el usuario completa el pago)
    checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
    payouts:
      # Producto "Pagos a Terceros" de Wompi — API distinta a la de Checkout,
      # con sus propias credenciales (API Key + Principal User ID) y, muy
      # probablemente, su propia URL base. NO se pone un default aquí:
      # confirmar el valor real en el dashboard de Wompi al activar el
      # producto (ver WompiPayoutConfig / WompiPayoutAdapter para más contexto).
      api-url: ${WOMPI_PAYOUTS_API_URL}
      api-key: ${WOMPI_PAYOUTS_API_KEY}
      principal-user-id: ${WOMPI_PAYOUTS_PRINCIPAL_USER_ID}
      # Nombres de header de autenticación — provisionales, confirmar contra
      # la documentación real entregada al activar el producto.
      auth-header: ${WOMPI_PAYOUTS_AUTH_HEADER:Authorization}
      principal-header: ${WOMPI_PAYOUTS_PRINCIPAL_HEADER:X-Principal-User-Id}
      # Cuenta de origen (Wompi/Bancolombia) que fondea los payouts (GET /accounts)
      source-account-id: ${WOMPI_PAYOUTS_SOURCE_ACCOUNT_ID}
      # Secreto para validar la firma de los webhooks de payouts (independiente
      # del webhook-secret de depósitos)
      webhook-secret: ${WOMPI_PAYOUTS_WEBHOOK_SECRET}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8090}
    api-key: ${NOTIFICATION_API_KEY}

  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:mock-sid}
    auth-token: ${TWILIO_AUTH_TOKEN:mock-token}
    phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
    whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:+1234567890}

  # --- Motor de Distribución de Capital (P2P: inversionistas <-> deudores) ---
  capital-engine:
    # Modelo de cálculo del margen sobre el interés que paga el deudor:
    # DIRECT_RATE_SUBTRACTION (A), INTEREST_COMMISSION (B, recomendado), CAPITAL_COMMISSION (C).
    margin-model: ${CAPITAL_ENGINE_MARGIN_MODEL:INTEREST_COMMISSION}
    # Tasa de margen de la plataforma (0.02 = 2%).
    margin-rate: ${CAPITAL_ENGINE_MARGIN_RATE:0.02}
    # Base de la tasa de interés del préstamo: NOMINAL_ANNUAL | EFFECTIVE_ANNUAL | MONTHLY.
    rate-basis: ${CAPITAL_ENGINE_RATE_BASIS:NOMINAL_ANNUAL}
    # Máximo % de un depósito que se puede concentrar en un solo deudor (diversificación real).
    concentration-cap-percentage: ${CAPITAL_ENGINE_CONCENTRATION_CAP:0.20}
    # % del saldo pendiente que el Fondo de Garantías puede cubrir en mora sostenida.
    # Nunca 1.00: el fondo no garantiza el 100% del retorno del capital.
    guarantee-fund-coverage-ratio: ${CAPITAL_ENGINE_FUND_COVERAGE_RATIO:0.70}
    # Días de mora a partir de los cuales se evalúa la cobertura del Fondo de Garantías.
    guarantee-fund-activation-days-late: ${CAPITAL_ENGINE_FUND_ACTIVATION_DAYS:90}

logging:
  level:
    com.cooperativa.met: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile:
        - dev
        - prod
    import: "optional:vault://"

