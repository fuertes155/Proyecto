spring:
  jpa:
    show-sql: true
  flyway:
    enabled: true
  # En dev: deshabilitar el health check de mail para que el actuator no falle
  # cuando las credenciales SMTP no están configuradas
  mail:
    test-connection: false

logging:
  level:
    com.cooperativa.met: DEBUG
    # Silenciar el error de mail en dev (no es crítico para desarrollo local)
    org.springframework.mail: WARN

management:
  health:
    mail:
      # Deshabilitado en dev — evita que el actuator/health devuelva DOWN
      # cuando no hay credenciales SMTP configuradas
      enabled: false

met:
  payments:
    # Pasarela simulada (/api/v1/mock-payment-gateway). Para probar contra el sandbox
    # real de Wompi activa además el perfil "sandbox" (p. ej. SPRING_PROFILES_ACTIVE=dev,sandbox).
    gateway: ${MET_PAYMENTS_GATEWAY:mock}
    payout-gateway: ${MET_PAYMENTS_PAYOUT_GATEWAY:mock}
  security:
    jwt:
      secret: ${JWT_SECRET}
    encryption:
      aes-key: ${AES_KEY}
  dev:
    # Imprime en logs el monto del micro-depósito de verificación de cuenta
    # bancaria (sin banco real no hay extracto donde verlo).
    log-verification-amount: true
  mail:
    # Solo en dev: si el envío de correo falla (p. ej. no hay credenciales SMTP configuradas),
    # imprime el OTP en logs para poder seguir probando localmente sin bloquear al desarrollador.
    log-otp-on-failure: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
