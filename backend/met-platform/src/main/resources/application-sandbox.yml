# ==============================================================================
# Perfil "sandbox": depósitos contra el SANDBOX REAL de Wompi (sin dinero real).
#
# Se combina con el perfil base que quieras conservar:
#   Local (Docker):  SPRING_PROFILES_ACTIVE=dev,sandbox
#   Render:          SPRING_PROFILES_ACTIVE=prod,sandbox
# (el orden importa: "sandbox" va al final para que sus valores ganen).
#
# Requiere llaves de sandbox (dashboard.wompi.co → Desarrolladores):
#   WOMPI_PUBLIC_KEY=pub_test_…        WOMPI_PRIVATE_KEY=prv_test_…
#   WOMPI_INTEGRITY_SECRET=test_integrity_…
#   WOMPI_WEBHOOK_SECRET=test_events_…  (secreto de EVENTOS)
#   WOMPI_REDIRECT_URL=https://<host público>/api/v1/payments/wompi/return
# y registrar en el dashboard la URL de eventos:
#   https://<host público>/api/v1/webhooks/payment
#
# Datos de prueba: tarjeta 4242 4242 4242 4242 (aprobada) / 4111 1111 1111 1111
# (rechazada) · Nequi 3991111111 (aprobada) / 3992222222 (rechazada) · PSE banco
# "1" (aprueba) / "2" (rechaza).
# ==============================================================================
met:
  payments:
    gateway: wompi
    # "Pagos a Terceros" (retiros) es otro producto de Wompi, aún sin credenciales:
    # los retiros siguen simulados. Cambiar a "wompi" cuando se active.
    payout-gateway: ${MET_PAYMENTS_PAYOUT_GATEWAY:mock}
  wompi:
    # Fijo a propósito: este perfil nunca debe apuntar a producción.
    api-url: https://sandbox.wompi.co/v1
    # Trae al arrancar los bancos PSE de prueba de Wompi para el selector de la app.
    sync-banks-on-startup: true
