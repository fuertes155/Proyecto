spring:
  datasource:
    url: 'jdbc:h2:mem:met;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS "TEXT" AS VARCHAR\;CREATE DOMAIN IF NOT EXISTS "BLOB" AS BYTEA\;CREATE DOMAIN IF NOT EXISTS jsonb AS JSON'
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  config:
    import: ""
  cloud:
    vault:
      enabled: false

met:
  security:
    jwt:
      secret: test-secret-key-with-minimum-256-bits-length-for-jwt-hmac-sha
      expiration-ms: 3600000
      refresh-expiration-ms: 604800000
    encryption:
      aes-key: test-aes-key-32-characters-long!!
  ai:
    gemini:
      api-key: test-gemini-key
  wompi:
    public-key: test-pub-key
    private-key: test-priv-key
    integrity-secret: test-int-secret
    webhook-secret: test-webhook-secret
    payouts:
      api-url: http://localhost:0/wompi-payouts-test
      api-key: test-payouts-api-key
      principal-user-id: test-payouts-principal-user-id
      source-account-id: test-payouts-source-account-id
      webhook-secret: test-payouts-webhook-secret
  cors:
    allowed-origins:
      - http://localhost:3000
  notification-service:
    api-key: test-notification-api-key
