spring:
  datasource:
    url: jdbc:h2:mem:met;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  config:
    import: ""
  cloud:
    vault:
      enabled: false

met:
  security:
    jwt:
      secret: test-secret-key-with-minimum-256-bits-length-for-jwt-hmac-sha
      expiration-ms: 3600000
      refresh-expiration-ms: 604800000
    encryption:
      aes-key: test-aes-key-32-characters-long!!
  ai:
    gemini:
      api-key: test-gemini-key
  wompi:
    public-key: test-pub-key
    private-key: test-priv-key
    integrity-secret: test-int-secret
    webhook-secret: test-webhook-secret
  cors:
    allowed-origins:
      - http://localhost:3000
