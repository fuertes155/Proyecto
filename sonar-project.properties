sonar.projectKey=met-platform
sonar.organization=met-cooperativa
sonar.projectName=Met Platform

# Directorios de código fuente (Backend y Mobile)
sonar.sources=backend/met-platform/src/main/java,mobile/met_app/lib

# Configuraciones específicas de Java
sonar.java.binaries=backend/met-platform/target/classes
sonar.java.source=17

# Archivos de prueba (Opcional, para coverage)
sonar.tests=backend/met-platform/src/test/java,mobile/met_app/test

# Exclusiones (archivos generados o no relevantes para seguridad)
sonar.exclusions=**/generated/**,**/*.g.dart,**/*.freezed.dart,**/target/**,**/build/**,**/.dart_tool/**
